name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + server game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run server game tests
        run: |
          chmod +x gradlew
          ./gradlew build runGameTest --no-configuration-cache

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: airships-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/run/**/logs/
          if-no-files-found: ignore

  client_game_test:
    name: Client game test (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run client game test
        run: |
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-configuration-cache

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-screenshots
          path: |
            **/screenshots/
            **/build/run/**/logs/
            **/run/**/logs/
            **/crash-reports/
          if-no-files-found: ignore
