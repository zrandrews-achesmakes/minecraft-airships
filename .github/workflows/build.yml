name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + server game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run server game tests
        run: |
          chmod +x gradlew
          ./gradlew build runGameTest --no-configuration-cache

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: airships-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/run/**/logs/
          if-no-files-found: ignore

  client_game_test:
    name: Client game test (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The game needs OpenGL 3.3+. The runner has no GPU, so use Mesa's software renderer (llvmpipe)
      # and start xvfb with GLX enabled. Without this the game fails with "Couldn't find matching GLX
      # visual" and then sits there until the job times out.
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Check OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" glxinfo -B

      - name: Run client game test
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest --no-configuration-cache

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-screenshots
          path: |
            **/screenshots/
            **/build/run/**/logs/
            **/run/**/logs/
            **/crash-reports/
          if-no-files-found: ignore
