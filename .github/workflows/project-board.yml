name: Sync issues to project board

# Moves each issue's card on the project board to match its labels:
#   closed                     -> Done
#   label "needs owner check"  -> Human Review (wins over "in progress" and "ready")
#   label "in progress"        -> In progress
#   label "ready"              -> Ready
#   anything else              -> Backlog
# Needs a repository secret PROJECT_TOKEN: a classic personal access token
# with the "project" and "repo" scopes (GitHub's built-in token can't edit user projects).

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  workflow_dispatch: # "Run workflow" re-syncs every issue

concurrency:
  group: project-board
  cancel-in-progress: false

env:
  PROJECT_LOGIN: zrandrews-achesmakes
  PROJECT_NUMBER: 4

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Move cards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}       # project board edits
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # reading issues
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a PROJECT_TOKEN secret (classic token with the 'project' scope)."
            exit 1
          fi

          # Talk to GraphQL directly: gh's "project" commands insist on extra token scopes.
          board=$(gh api graphql -f login="$PROJECT_LOGIN" -F number="$PROJECT_NUMBER" -f query='
            query($login: String!, $number: Int!) {
              user(login: $login) {
                projectV2(number: $number) {
                  id
                  field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } }
                }
              }
            }')
          project_id=$(echo "$board" | jq -r .data.user.projectV2.id)
          field_id=$(echo "$board" | jq -r .data.user.projectV2.field.id)
          option() { echo "$board" | jq -r --arg n "$1" '.data.user.projectV2.field.options[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id'; }
          echo "Board columns: $(echo "$board" | jq -r '[.data.user.projectV2.field.options[].name] | join(", ")')"

          sync_issue() {
            local n=$1
            local info state labels status option_id item_id
            info=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$REPO/issues/$n")
            state=$(echo "$info" | jq -r .state)
            labels=$(echo "$info" | jq -r '[.labels[].name] | join(",")')
            if [ "$state" = "closed" ]; then status="Done"
            elif [[ ",$labels," == *",needs owner check,"* ]]; then status="Human Review"
            elif [[ ",$labels," == *",in progress,"* ]]; then status="In progress"
            elif [[ ",$labels," == *",ready,"* ]]; then status="Ready"
            else status="Backlog"; fi

            option_id=$(option "$status")
            if [ -z "$option_id" ]; then echo "::warning::No '$status' column on the board"; return; fi

            # Adding an issue that's already on the board just returns its existing card.
            item_id=$(gh api graphql -f project="$project_id" -f content="$(echo "$info" | jq -r .node_id)" -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
              }' --jq .data.addProjectV2ItemById.item.id)

            gh api graphql -f project="$project_id" -f item="$item_id" -f field="$field_id" -f option="$option_id" -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field,
                  value: {singleSelectOptionId: $option}}) { projectV2Item { id } }
              }' > /dev/null
            echo "#$n -> $status"
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            for n in $(GH_TOKEN="$REPO_TOKEN" gh api --paginate "repos/$REPO/issues?state=all&per_page=100" --jq '.[] | select(.pull_request == null) | .number'); do
              sync_issue "$n"
            done
          else
            sync_issue "$ISSUE"
          fi
